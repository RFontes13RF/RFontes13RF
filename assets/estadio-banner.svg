<svg xmlns="http://www.w3.org/2000/svg" width="900" height="300" viewBox="0 0 900 300" role="img" aria-label="Entrar no estádio: abrir o portfólio interativo de Ryan Fontes">
  <title>Entrar no estádio — portfólio interativo</title>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#060912"/>
      <stop offset="1" stop-color="#0b1324"/>
    </linearGradient>
    <linearGradient id="grass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#166534"/>
      <stop offset="1" stop-color="#15803d"/>
    </linearGradient>
    <linearGradient id="beam" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff7c2" stop-opacity=".55"/>
      <stop offset="1" stop-color="#fff7c2" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fff" stop-opacity="0"/>
      <stop offset=".5" stop-color="#fff" stop-opacity=".55"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="screen"><rect x="12" y="44" width="876" height="244" rx="2"/></clipPath>
    <clipPath id="btn"><rect x="300" y="196" width="300" height="56" rx="28"/></clipPath>
    <style>
      .t  { font-family: Impact, 'Anton', 'Arial Black', sans-serif; }
      .m  { font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; }
      .mono { font-family: 'Fira Code', Consolas, monospace; }
      .beam  { animation: flick 3.2s ease-in-out infinite; transform-origin: top; }
      .beam2 { animation-delay: -1.6s; }
      .pulse { animation: pulse 1.6s ease-in-out infinite; transform-origin: 450px 224px; }
      .ring  { animation: ring 1.6s ease-out infinite; transform-origin: 450px 224px; }
      .sweep { animation: sweep 2.8s ease-in-out infinite; }
      .ball  { animation: bounce 1.1s cubic-bezier(.5,0,.5,1) infinite alternate; }
      .cursor{ animation: click 3.2s ease-in-out infinite; }
      .caret { animation: blink 1s steps(1) infinite; }
      @keyframes flick { 0%,100% { opacity: .9 } 50% { opacity: .45 } }
      @keyframes pulse { 0%,100% { transform: scale(1) } 50% { transform: scale(1.05) } }
      @keyframes ring  { 0% { transform: scale(1); opacity: .7 } 100% { transform: scale(1.25, 1.6); opacity: 0 } }
      @keyframes sweep { 0% { transform: translateX(-160px) } 60%,100% { transform: translateX(460px) } }
      @keyframes bounce{ from { transform: translateY(0) } to { transform: translateY(-26px) } }
      @keyframes click {
        0%   { transform: translate(120px, 60px) }
        45%  { transform: translate(0, 0) }
        52%  { transform: translate(0, 0) scale(.85) }
        60%  { transform: translate(0, 0) }
        100% { transform: translate(0, 0) }
      }
      @keyframes blink { 50% { opacity: 0 } }
    </style>
  </defs>

  <!-- janela do navegador: deixa claro que é um site -->
  <rect x="1" y="1" width="898" height="298" rx="14" fill="#111c33" stroke="#22304d" stroke-width="2"/>
  <circle cx="30" cy="22" r="6" fill="#ff5f57"/>
  <circle cx="50" cy="22" r="6" fill="#febc2e"/>
  <circle cx="70" cy="22" r="6" fill="#28c840"/>
  <rect x="200" y="10" width="500" height="24" rx="12" fill="#060912" stroke="#22304d"/>
  <text x="222" y="27" class="mono" font-size="13" fill="#8d9bb8">🔒 <tspan fill="#e8eefc">rfontes13rf.github.io</tspan>/RFontes13RF<tspan class="caret" fill="#ffdf00">|</tspan></text>

  <g clip-path="url(#screen)">
    <rect x="12" y="44" width="876" height="244" fill="url(#sky)"/>

    <!-- refletores -->
    <polygon class="beam" points="70,44 110,44 330,288 -60,288" fill="url(#beam)"/>
    <polygon class="beam beam2" points="790,44 830,44 960,288 570,288" fill="url(#beam)"/>
    <g fill="#fff7c2"><rect x="66" y="48" width="48" height="8" rx="3"/><rect x="786" y="48" width="48" height="8" rx="3"/></g>

    <!-- arquibancada -->
    <g fill="#22304d" opacity=".9">
      <rect x="12" y="160" width="876" height="6"/>
      <rect x="12" y="172" width="876" height="4" opacity=".6"/>
    </g>
    <g fill="#ffdf00" opacity=".55">
      <circle cx="140" cy="156" r="2"/><circle cx="182" cy="154" r="2"/><circle cx="250" cy="157" r="2"/>
      <circle cx="610" cy="155" r="2"/><circle cx="688" cy="157" r="2"/><circle cx="742" cy="154" r="2"/>
    </g>
    <g fill="#009c3b" opacity=".6">
      <circle cx="160" cy="157" r="2"/><circle cx="220" cy="155" r="2"/><circle cx="650" cy="156" r="2"/><circle cx="718" cy="155" r="2"/>
    </g>

    <!-- gramado em perspectiva -->
    <polygon points="150,190 750,190 900,288 0,288" fill="url(#grass)"/>
    <g fill="none" stroke="#e8eefc" stroke-opacity=".35" stroke-width="2">
      <polygon points="178,196 722,196 860,284 40,284"/>
      <line x1="450" y1="196" x2="450" y2="284"/>
      <ellipse cx="450" cy="226" rx="90" ry="24"/>
    </g>

    <!-- bola quicando -->
    <g transform="translate(176 232)">
      <ellipse cx="0" cy="14" rx="12" ry="3" fill="#000" opacity=".35"/>
      <g class="ball">
        <circle r="11" fill="#fff"/>
        <polygon points="0,-5 5,-1 3,5 -3,5 -5,-1" fill="#0b1324"/>
      </g>
    </g>

    <!-- título -->
    <text x="450" y="96" text-anchor="middle" class="m" font-size="15" letter-spacing="4" fill="#ffdf00" font-weight="700">PORTFÓLIO INTERATIVO · CLIQUE E JOGUE</text>
    <text x="450" y="150" text-anchor="middle" class="t" font-size="54" letter-spacing="2" fill="#e8eefc" stroke="#060912" stroke-width="1">RYAN FONTES · CAMISA 10</text>
    <text x="450" y="182" paint-order="stroke" stroke="#060912" stroke-width="4" text-anchor="middle" class="m" font-size="15" fill="#e8eefc" opacity=".85">projetos · stack · temporada no GitHub · decisão por pênaltis</text>

    <!-- botão -->
    <rect class="ring" x="300" y="196" width="300" height="56" rx="28" fill="none" stroke="#ffdf00" stroke-width="3"/>
    <g class="pulse">
      <rect x="300" y="196" width="300" height="56" rx="28" fill="#ffdf00"/>
      <g clip-path="url(#btn)"><rect class="sweep" x="300" y="196" width="90" height="56" fill="url(#shine)"/></g>
      <text x="450" y="233" text-anchor="middle" class="t" font-size="26" letter-spacing="1.5" fill="#060912">ENTRAR NO ESTÁDIO ▶</text>
    </g>

    <!-- cursor clicando -->
    <g transform="translate(560 232)">
      <g class="cursor">
        <path d="M0 0 L0 26 L7 20 L12 31 L17 29 L12 18 L21 18 Z" fill="#fff" stroke="#060912" stroke-width="2" stroke-linejoin="round"/>
      </g>
    </g>
  </g>
</svg>
