<svg xmlns="http://www.w3.org/2000/svg" width="900" height="300" viewBox="0 0 900 300" role="img" aria-label="Ver portfólio: abrir o site de Ryan Fontes">
  <title>Portfólio — Ryan Fontes</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1324"/>
      <stop offset="1" stop-color="#111c33"/>
    </linearGradient>
    <radialGradient id="glow" cx=".85" cy=".2" r=".7">
      <stop offset="0" stop-color="#4f9cf9" stop-opacity=".22"/>
      <stop offset="1" stop-color="#4f9cf9" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fff" stop-opacity="0"/>
      <stop offset=".5" stop-color="#fff" stop-opacity=".35"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="screen"><rect x="12" y="44" width="876" height="244" rx="2"/></clipPath>
    <clipPath id="btn"><rect x="52" y="200" width="228" height="52" rx="10"/></clipPath>
    <style>
      .h  { font-family: 'Segoe UI', system-ui, -apple-system, 'Helvetica Neue', Arial, sans-serif; }
      .mono { font-family: 'Fira Code', Consolas, monospace; }
      .caret { animation: blink 1s steps(1) infinite; }
      .ring  { animation: ring 2s ease-out infinite; transform-origin: 166px 226px; }
      .sweep { animation: sweep 3s ease-in-out infinite; }
      .cursor{ animation: point 3.6s ease-in-out infinite; }
      .bar   { transform-box: fill-box; transform-origin: bottom; animation: grow 3.6s ease-in-out infinite; }
      .b2 { animation-delay: .15s } .b3 { animation-delay: .3s } .b4 { animation-delay: .45s } .b5 { animation-delay: .6s }
      .card  { animation: fade 3.6s ease-in-out infinite; }
      .c2 { animation-delay: .25s } .c3 { animation-delay: .5s }
      @keyframes blink { 50% { opacity: 0 } }
      @keyframes ring  { 0% { transform: scale(1); opacity: .6 } 70%,100% { transform: scale(1.12, 1.4); opacity: 0 } }
      @keyframes sweep { 0% { transform: translateX(-120px) } 60%,100% { transform: translateX(320px) } }
      @keyframes point {
        0%   { transform: translate(90px, 50px); opacity: 0 }
        15%  { opacity: 1 }
        45%  { transform: translate(0, 0) }
        52%  { transform: translate(0, 0) scale(.85) }
        60%,100% { transform: translate(0, 0); opacity: 1 }
      }
      @keyframes grow { 0% { transform: scaleY(.15) } 35%,100% { transform: scaleY(1) } }
      @keyframes fade { 0% { opacity: .25 } 30%,100% { opacity: 1 } }
    </style>
  </defs>

  <!-- janela do navegador: deixa claro que é um site -->
  <rect x="1" y="1" width="898" height="298" rx="14" fill="#111c33" stroke="#22304d" stroke-width="2"/>
  <circle cx="30" cy="22" r="6" fill="#ff5f57"/>
  <circle cx="50" cy="22" r="6" fill="#febc2e"/>
  <circle cx="70" cy="22" r="6" fill="#28c840"/>
  <rect x="200" y="10" width="500" height="24" rx="12" fill="#060912" stroke="#22304d"/>
  <text x="222" y="27" class="mono" font-size="13" fill="#8d9bb8">🔒 <tspan fill="#e8eefc">rfontes13rf.github.io</tspan>/RFontes13RF<tspan class="caret" fill="#4f9cf9">|</tspan></text>

  <g clip-path="url(#screen)">
    <rect x="12" y="44" width="876" height="244" fill="url(#bg)"/>
    <rect x="12" y="44" width="876" height="244" fill="url(#glow)"/>

    <!-- texto -->
    <text x="52" y="92" class="h" font-size="14" font-weight="700" letter-spacing="3" fill="#4f9cf9">PORTFÓLIO</text>
    <text x="50" y="140" class="h" font-size="44" font-weight="800" fill="#e8eefc">Ryan Fontes</text>
    <text x="52" y="172" class="h" font-size="17" fill="#8d9bb8">Backend Developer · Python · Dados &amp; IA</text>

    <!-- botão -->
    <rect class="ring" x="52" y="200" width="228" height="52" rx="10" fill="none" stroke="#4f9cf9" stroke-width="2"/>
    <rect x="52" y="200" width="228" height="52" rx="10" fill="#4f9cf9"/>
    <g clip-path="url(#btn)"><rect class="sweep" x="52" y="200" width="70" height="52" fill="url(#shine)"/></g>
    <text x="166" y="233" text-anchor="middle" class="h" font-size="19" font-weight="700" fill="#060912">Ver portfólio  →</text>

    <text x="300" y="232" class="h" font-size="14" fill="#8d9bb8">Sobre · Stack · Projetos · Trajetória</text>

    <!-- cursor -->
    <g transform="translate(240 230)">
      <g class="cursor">
        <path d="M0 0 L0 24 L6.5 18.5 L11 28.5 L15.5 26.5 L11 16.5 L19 16.5 Z" fill="#fff" stroke="#060912" stroke-width="2" stroke-linejoin="round"/>
      </g>
    </g>

    <!-- prévia do site -->
    <g transform="translate(620 66)">
      <rect width="236" height="200" rx="10" fill="#060912" stroke="#22304d"/>
      <rect x="14" y="14" width="60" height="8" rx="4" fill="#e8eefc" opacity=".8"/>
      <rect x="150" y="14" width="22" height="8" rx="4" fill="#22304d"/>
      <rect x="178" y="14" width="22" height="8" rx="4" fill="#22304d"/>
      <rect x="206" y="14" width="16" height="8" rx="4" fill="#4f9cf9"/>
      <g class="card"><rect x="14" y="36" width="208" height="44" rx="6" fill="#111c33"/><rect x="24" y="48" width="96" height="8" rx="4" fill="#e8eefc" opacity=".7"/><rect x="24" y="62" width="140" height="6" rx="3" fill="#8d9bb8" opacity=".5"/></g>
      <g class="card c2"><rect x="14" y="90" width="100" height="44" rx="6" fill="#111c33"/><rect x="24" y="102" width="50" height="6" rx="3" fill="#4f9cf9"/><rect x="24" y="114" width="70" height="5" rx="2.5" fill="#8d9bb8" opacity=".5"/></g>
      <g class="card c3"><rect x="122" y="90" width="100" height="44" rx="6" fill="#111c33"/><rect x="132" y="102" width="50" height="6" rx="3" fill="#2dcb73"/><rect x="132" y="114" width="70" height="5" rx="2.5" fill="#8d9bb8" opacity=".5"/></g>
      <rect x="14" y="144" width="208" height="44" rx="6" fill="#111c33"/>
      <g fill="#4f9cf9">
        <rect class="bar" x="28" y="160" width="16" height="20" rx="2"/>
        <rect class="bar b2" x="54" y="154" width="16" height="26" rx="2" opacity=".85"/>
        <rect class="bar b3" x="80" y="164" width="16" height="16" rx="2" opacity=".7"/>
        <rect class="bar b4" x="106" y="152" width="16" height="28" rx="2"/>
        <rect class="bar b5" x="132" y="158" width="16" height="22" rx="2" opacity=".85"/>
      </g>
      <rect x="160" y="156" width="52" height="6" rx="3" fill="#8d9bb8" opacity=".5"/>
      <rect x="160" y="168" width="36" height="6" rx="3" fill="#8d9bb8" opacity=".35"/>
    </g>
  </g>
</svg>
