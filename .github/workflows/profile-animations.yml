name: Generate Profile Animations

on:
  schedule:
    - cron: "0 0 * * *"  # roda todo dia à meia-noite UTC
  workflow_dispatch:      # permite rodar manualmente pelo GitHub Actions
  push:
    branches: [main]
    paths:
      - "scripts/futebol.py"
      - ".github/workflows/profile-animations.yml"

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # ⚽ Commit Futebol Clube
      - name: Generate football match
        run: python scripts/futebol.py --user "${{ github.repository_owner }}" --name "Ryan Fontes" --out dist/futebol.svg
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # 🐍 Snake (mantida como alternativa)
      - uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark

      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
