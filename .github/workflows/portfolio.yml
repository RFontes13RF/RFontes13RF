name: Deploy Portfolio

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - ".github/workflows/portfolio.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v4

      # Publica a pasta site/ na branch gh-pages → https://rfontes13rf.github.io/RFontes13RF/
      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: gh-pages
          build_dir: site
          jekyll: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
